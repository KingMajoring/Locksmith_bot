name: Deploy to Azure

on:
  push:
    branches:
      - claude/multi-area-management-tool-1cn4og
  workflow_dispatch: {}

# Azure's Kudu zip-deploy endpoint only runs one deployment at a time
# per site — without this, two pushes close together (or a manual
# workflow_dispatch alongside a push) queue overlapping "deploy" jobs
# that both hit Kudu concurrently and stall waiting on its lock.
# Only the latest commit's deploy matters, so cancel any older run
# for the same branch rather than letting them race.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
      - run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: wgtk-ops-tool
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
