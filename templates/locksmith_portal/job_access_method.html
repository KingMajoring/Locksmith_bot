{% extends "locksmith_portal/base.html" %}
{% block title %}Job {{ report_id }} — WGTK Locksmith Portal{% endblock %}
{% block content %}
<a class="back-link" href="{{ back_url }}">&larr; Back</a>
<h1>How did you gain access?</h1>

<form method="post" action="{{ action_url }}" enctype="multipart/form-data" class="card" id="access-method-form">
  {% csrf_token %}

  <div class="field-group">
    <div class="outcome-choice">
      <label><input type="radio" name="access_method" value="picked" class="access-method-input" required> Picked</label>
      <label><input type="radio" name="access_method" value="airbag" class="access-method-input"> Airbag</label>
      <label><input type="radio" name="access_method" value="key_code" class="access-method-input"> Key code supplied</label>
    </div>
  </div>

  <div class="field-group access-branch" data-branch="picked" hidden>
    <label for="pick_used">What pick was used</label>
    <input type="text" id="pick_used" name="pick_used" placeholder="e.g. HU101, HON66">
  </div>

  <div class="field-group access-branch" data-branch="key_code" hidden>
    <label for="key_code">Key code supplied</label>
    <input type="text" id="key_code" name="key_code" placeholder="e.g. code supplied by dealer/DVLA">
  </div>

  <div class="field-group access-branch" data-branch="airbag" hidden>
    <p class="disclaimer-text">{{ disclaimer_text }}</p>
    <label>Customer signature</label>
    <div class="signature-preview" id="disclaimer-signature-preview">Not signed yet</div>
    <p><button type="button" class="btn" id="open-disclaimer-signature">Tap to sign</button></p>
    <input type="hidden" name="disclaimer_signature" id="disclaimer_signature">

    <label>Photos of the door frame <span class="sub">(up to 3 photos)</span></label>
    <input type="file" name="photo_door_frame" accept="image/*" multiple>
  </div>

  <p style="margin-top:1rem;"><button class="btn" type="submit">Continue</button></p>
</form>

<div class="signature-modal" id="disclaimer-signature-modal" hidden>
  <div class="signature-modal-header">
    <span>Customer signature</span>
    <button type="button" class="signature-modal-close" id="close-disclaimer-signature" aria-label="Close">&times;</button>
  </div>
  <canvas id="signature-pad" class="signature-pad-fullscreen"></canvas>
  <div class="signature-modal-actions">
    <button type="button" class="btn-secondary" id="clear-signature">Clear</button>
    <button type="button" class="btn" id="done-disclaimer-signature">Done</button>
  </div>
</div>

<script>
  (function () {
    function showBranch(el, show) {
      el.hidden = !show;
    }

    document.querySelectorAll('.access-method-input').forEach(function (radio) {
      radio.addEventListener('change', function () {
        var chosen = radio.value;
        document.querySelectorAll('.access-branch').forEach(function (branch) {
          showBranch(branch, branch.dataset.branch === chosen);
        });
      });
    });
  })();

  (function () {
    // Signing happens in a full-screen pop-out rather than a small
    // inline canvas — confirmed live the inline version was too
    // cramped to sign legibly on a phone. The canvas only gets a real
    // pixel size once the modal is actually visible (a hidden element
    // reports zero size), so it's sized on each open instead of once
    // upfront — which also means no fixed-resolution/CSS-scale split,
    // pointer coordinates are plain offsets against the canvas's own
    // rendered size.
    var canvas = document.getElementById('signature-pad');
    var modal = document.getElementById('disclaimer-signature-modal');
    var preview = document.getElementById('disclaimer-signature-preview');
    var hiddenInput = document.getElementById('disclaimer_signature');
    if (!canvas || !modal || !preview || !hiddenInput) return;

    var ctx = canvas.getContext('2d');
    var drawing = false;
    var hasSignature = false;

    function applyPenStyle() {
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#16241d';
    }

    function point(e) {
      var rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function start(e) {
      e.preventDefault();
      // Start the actual stroke first — confirmed some Android browsers
      // can throw on setPointerCapture here, and since that used to run
      // before any of this, a throw meant the whole stroke silently
      // never started. Capture is best-effort: it just keeps delivering
      // move/up events to the canvas if the finger drifts outside its
      // bounds mid-stroke.
      drawing = true;
      hasSignature = true;
      var p = point(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }

    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      var p = point(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    function end() { drawing = false; }

    // Pointer Events (not separate mouse/touch listeners) — avoids the
    // touch/synthetic-mouse-event double-handling that's the usual cause
    // of a signature pad working on desktop but not on a phone.
    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);

    function openModal() {
      modal.hidden = false;
      document.body.style.overflow = 'hidden';
      // Wait a frame so the now-visible modal has real dimensions
      // before sizing the canvas to match — sizing while still hidden
      // would give it 0x0.
      requestAnimationFrame(function () {
        var rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        applyPenStyle();
      });
    }

    function closeModal() {
      modal.hidden = true;
      document.body.style.overflow = '';
    }

    document.getElementById('open-disclaimer-signature').addEventListener('click', openModal);
    document.getElementById('close-disclaimer-signature').addEventListener('click', closeModal);
    document.getElementById('clear-signature').addEventListener('click', function () {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasSignature = false;
    });
    document.getElementById('done-disclaimer-signature').addEventListener('click', function () {
      if (!hasSignature) {
        alert('Please sign before tapping Done.');
        return;
      }
      hiddenInput.value = canvas.toDataURL('image/png');
      preview.textContent = '✓ Signed';
      preview.classList.add('signature-preview-done');
      closeModal();
    });

    document.getElementById('access-method-form').addEventListener('submit', function (e) {
      var airbagBranch = document.querySelector('.access-branch[data-branch="airbag"]');
      if (airbagBranch && !airbagBranch.hidden) {
        if (!hasSignature) {
          e.preventDefault();
          alert('The customer needs to sign the disclaimer before continuing.');
          return;
        }
        hiddenInput.value = canvas.toDataURL('image/png');
      }
    });
  })();

  // Server also caps this at 3 (see MAX_PHOTOS_PER_KIND) — this just
  // saves a round trip by telling the locksmith straight away rather
  // than silently dropping the extras after upload.
  document.querySelectorAll('input[type=file][multiple]').forEach(function (input) {
    input.addEventListener('change', function () {
      if (input.files.length > 3) {
        alert('Only 3 photos allowed here — please choose 3 or fewer.');
        input.value = '';
      }
    });
  });
</script>
{% endblock %}
